<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us - Morning Coffee</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .contact-section {
            background-color: #f8f5f0;
        }

        .contact-info,
        .contact-form {
            background-color: #ffffff;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .contact-info h3,
        .contact-form h3 {
            color: #5c3d2e;
        }

        .form-control {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 12px 15px;
        }

        .form-control:focus {
            border-color: #8b5e3c;
            box-shadow: 0 0 0 0.2rem rgba(139, 94, 60, 0.15);
        }

        .btn-coffee {
            background-color: #6f4e37;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            transition: 0.3s;
        }

        .btn-coffee:hover {
            background-color: #4e3425;
            color: white;
            transform: translateY(-2px);
        }
    </style>
</head>

<body>

    <!-- Contact Section -->
    <section id="contact" class="contact-section py-5">

        <div class="container">

            <!-- Section Title -->
            <div class="text-center mb-5">
                <h2 class="fw-bold section-title">Contact Us</h2>

                <p class="text-muted">
                    Have a question? We'd love to hear from you!
                </p>
            </div>

            <div class="row g-4 align-items-stretch">

                <!-- Contact Information -->
                <div class="col-lg-5">

                    <div class="contact-info p-4 h-100">

                        <h3 class="fw-bold mb-4">
                            Get In Touch ☕️
                        </h3>

                        <div class="mb-4">
                            <h6 class="fw-bold">📍 Location</h6>
                            <p class="text-muted mb-0">
                                Phnom Penh, Cambodia
                            </p>
                        </div>

                        <div class="mb-4">
                            <h6 class="fw-bold">📞 Phone</h6>
                            <p class="text-muted mb-0">
                                +855 12 345 678
                            </p>
                        </div>

                        <div class="mb-4">
                            <h6 class="fw-bold">📧 Email</h6>
                            <p class="text-muted mb-0">
                                hello@morningcoffee.com
                            </p>
                        </div>

                        <div>
                            <h6 class="fw-bold">🕒 Opening Hours</h6>

                            <p class="text-muted mb-1">
                                Monday - Friday: 7:00 AM - 8:00 PM
                            </p>

                            <p class="text-muted mb-0">
                                Saturday - Sunday: 8:00 AM - 9:00 PM
                            </p>
                        </div>

                    </div>

                </div>


                <!-- Contact Form -->
                <div class="col-lg-7">

                    <div class="contact-form p-4 h-100">

                        <h3 class="fw-bold mb-4">
                            Send Us a Message
                        </h3>

                        <form>

                            <!-- Name & Email -->
                            <div class="row">

                                <div class="col-md-6 mb-3">

                                    <label class="form-label fw-semibold">
                                        Your Name
                                    </label>
                                    

                                    <input
                                        type="text"
                                        class="form-control"
                                        placeholder="Enter your name"
                                    >

                                </div>


                                <div class="col-md-6 mb-3">

                                    <label class="form-label fw-semibold">
                                        Email
                                    </label>

                                    <input
                                        type="email"
                                        class="form-control"
                                        placeholder="Enter your email"
                                    >

                                </div>

                            </div>


                            <!-- Subject -->
                            <div class="mb-3">

                                <label class="form-label fw-semibold">
                                    Subject
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    placeholder="What is it about?"
                                >

                            </div>


                            <!-- Message -->
                            <div class="mb-3">

                                <label class="form-label fw-semibold">
                                    Message
                                </label>

                                <textarea
                                    class="form-control"
                                    rows="5"
                                    placeholder="Write your message..."
                                ></textarea>

                            </div>


                            <!-- Button -->
                            <button
                                type="submit"
                                class="btn btn-coffee w-100 fw-bold py-2"
                            >
                                Send Message ☕️
                            </button>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </section>

</body>
</html>

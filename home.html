<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a class="navbar-brand" href="#home"><i class="bi bi-cup-hot-fill"></i> Brew & Bean</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="nav">
                <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-3">
                    <li><a class="nav-link" href="#home">Home</a></li>
                    <li><a class="nav-link" href="#about">About</a></li>
                    <li><a class="nav-link" href="#menu">Menu</a></li>
                    <li><a class="nav-link" href="#gallery">Gallery</a></li>
                    <li><a class="nav-link" href="#contact">Contact</a></li>
                    <li><a class="btn btn-coffee ms-lg-2" href="#menu">Order Now</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <!-- Header -->
    <header id="home" class="hero">
        <div class="container">
            <div class="hero-content">
                <p class="eyebrow">FRESHLY ROASTED • LOCALLY LOVED</p>
                <h1>Start your day<br><span>with perfect coffee.</span></h1>
                <p class="hero-text">Handcrafted coffee, fresh pastries, and a warm place to slow down and enjoy the
                    moment.</p>
                <div class="d-flex flex-wrap gap-3">
                    <a href="#menu" class="btn btn-coffee btn-lg">Explore Menu <i class="bi bi-arrow-right"></i></a>
                    <a href="#about" class="btn btn-outline-light btn-lg">Our Story</a>
                </div>
            </div>
        </div>
    </header>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</body>

</html>
